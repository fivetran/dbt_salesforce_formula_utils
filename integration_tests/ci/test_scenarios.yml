#   duckdb: ">=1.3.0,<2.0.0"

schema_variable_name: "salesforce_schema"

# TEMPORARY: testing solution_analytics#23 (explicit DuckDB CI database) before it merges to main.
# Revert this line before merging this PR.
test_branch: "bot/duckdb-v2-explicit-database"

include_databricks_sql: false
include_sqlserver: false
include_duckdb: true
include_dbt_compile: false

test_scenarios:
  - name: "Default"
    vars: {}
    include_incremental: false

  - name: "quoted identifiers"
    vars:
      using_quoted_identifiers: true
    include_incremental: false

  - name: "MDLS"
    vars:
      mdls_run: true
    include_incremental: false

  - name: "MDLS quoted identifiers"
    vars:
      mdls_run: true
      using_quoted_identifiers: true
    include_incremental: false
